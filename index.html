<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Times Table Practice</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #f0f0f0;
        text-align: center;
        padding-top: 40px;
    }
    #gameBox {
        background: white;
        width: 400px;
        margin: auto;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }
    .answerBtn {
        display: block;
        width: 90%;
        margin: 10px auto;
        padding: 12px;
        font-size: 20px;
        border-radius: 8px;
        border: none;
        background: #ddd;
        cursor: pointer;
        transition: background 0.2s;
    }
    .answerBtn:hover {
        background: #ccc;
    }
    .wrong {
        background: #ff6b6b !important;
        color: white;
    }
    #timer, #score {
        font-size: 22px;
        margin: 10px;
    }
    #startBtn {
        padding: 12px 20px;
        font-size: 20px;
        border-radius: 8px;
        border: none;
        background: #4CAF50;
        color: white;
        cursor: pointer;
    }
    #configBox input {
        width: 80px;
        padding: 5px;
        margin: 5px;
        font-size: 16px;
        text-align: center;
    }
</style>
</head>

<body>

<div id="gameBox">
    <h2>Multiple Times Table Practice</h2>

    <!-- CONFIG BOX -->
    <div id="configBox">
        <label>Questions: <input id="cfg_questions" type="number"></label><br>
        <label>Time (sec): <input id="cfg_time" type="number"></label><br>
        <label>From Table: <input id="cfg_fromtable" type="number"></label><br>
        <label>To Table: <input id="cfg_totable" type="number"></label><br>
        <label>Up to...: <input id="cfg_maxx" type="number"></label>
    </div>

    <!-- GAME INTERFACE -->
    <div id="timer">Time: 0</div>
    <div id="score">Question: 0</div>
    <h3 id="questionText">Press Start</h3>

    <div id="answers"></div>

    <button id="startBtn">Start Game</button>
</div>

<script>
    // DEFAULT VARIABLES
    let NUMBER_OF_QUESTIONS = 45;
    let TIME_LIMIT_SECONDS = 90;
    let FROM_TABLE = 0;
    let TO_TABLE = 12;
    let MAX_X = 12;

    let timeLeft = TIME_LIMIT_SECONDS;
    let questionCount = 0;
    let correctAnswer = 0;
    let wrongCount = 0;
    let timerInterval;

    function loadConfig() {
        NUMBER_OF_QUESTIONS = parseInt(document.getElementById("cfg_questions").value);
        TIME_LIMIT_SECONDS = parseInt(document.getElementById("cfg_time").value);
        FROM_TABLE = parseInt(document.getElementById("cfg_fromtable").value);
        TO_TABLE = parseInt(document.getElementById("cfg_totable").value);
        MAX_X = parseInt(document.getElementById("cfg_maxx").value);
    }

    function startGame() {
        loadConfig();

        timeLeft = TIME_LIMIT_SECONDS;
        questionCount = 0;
        wrongCount = 0;
        
        document.getElementById("timer").innerText = "Time: " + timeLeft;
        document.getElementById("score").innerText = `Question: 0 / ${NUMBER_OF_QUESTIONS}`;
        document.getElementById("startBtn").style.display = "none";
        
        // HIDE CONFIG DURING GAME
        document.getElementById("configBox").style.display = "none";

        timerInterval = setInterval(() => {
            timeLeft--;
            document.getElementById("timer").innerText = "Time: " + timeLeft;
            if (timeLeft <= 0) endGame();
        }, 1000);

        nextQuestion();
    }

    function nextQuestion() {
        if (questionCount >= NUMBER_OF_QUESTIONS) {
            endGame();
            return;
        }

        // RANDOM TABLE BETWEEN RANGE
        let table = Math.floor(Math.random() * (TO_TABLE - FROM_TABLE + 1)) + FROM_TABLE;

        // RANDOM X
        let x = Math.floor(Math.random() * MAX_X) + 1;

        correctAnswer = x * table;

        document.getElementById("questionText").innerText = `${x} × ${table} = ?`;

        let answers = [correctAnswer];

        while (answers.length < 6) {
            let wrong = correctAnswer + Math.floor(Math.random() * 40) - 20;
            if (!answers.includes(wrong) && wrong > 0) answers.push(wrong);
        }

        answers.sort(() => Math.random() - 0.5);

        let answerBox = document.getElementById("answers");
        answerBox.innerHTML = "";

        answers.forEach(a => {
            let btn = document.createElement("button");
            btn.className = "answerBtn";
            btn.innerText = a;
            btn.onclick = () => checkAnswer(a, btn);
            answerBox.appendChild(btn);
        });
    }

    function checkAnswer(a, btn) {
        if (a === correctAnswer) {
            questionCount++;
            document.getElementById("score").innerText =
                `Question: ${questionCount} / ${NUMBER_OF_QUESTIONS}`;
            nextQuestion();
        } else {
            wrongCount++;
            btn.classList.add("wrong");
        }
    }

    function endGame() {
        clearInterval(timerInterval);
        document.getElementById("questionText").innerText =
            `Game Over! You answered ${questionCount} / ${NUMBER_OF_QUESTIONS}.
            Wrong answers: ${wrongCount}`;
        document.getElementById("answers").innerHTML = "";
        document.getElementById("startBtn").style.display = "block";

        // SHOW CONFIG BOX AGAIN
        document.getElementById("configBox").style.display = "block";
    }

    document.getElementById("startBtn").onclick = startGame;

    // SET DEFAULT VALUES IN THE EDIT FORMS
    window.onload = () => {
        document.getElementById("cfg_questions").value = NUMBER_OF_QUESTIONS;
        document.getElementById("cfg_time").value = TIME_LIMIT_SECONDS;
        document.getElementById("cfg_fromtable").value = FROM_TABLE;
        document.getElementById("cfg_totable").value = TO_TABLE;
        document.getElementById("cfg_maxx").value = MAX_X;
    };
</script>

</body>
</html>
